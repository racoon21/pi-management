services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${DB_USER:-pi_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pi_password}
      POSTGRES_DB: ${DB_NAME:-pi_management}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pi_user} -d ${DB_NAME:-pi_management}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-pi_user}:${DB_PASSWORD:-pi_password}@db:5432/${DB_NAME:-pi_management}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ENVIRONMENT: production
      DEBUG: "false"
      CORS_ORIGINS_STR: ${CORS_ORIGINS_STR:-}
      WORKERS: ${WORKERS:-2}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  postgres_data:
