services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pi_user
      POSTGRES_PASSWORD: pi_password
      POSTGRES_DB: pi_management
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi_user -d pi_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile_dev
    environment:
      DATABASE_URL: postgresql+asyncpg://pi_user:pi_password@db:5432/pi_management
      SECRET_KEY: dev-secret-key-for-local-testing
      ENVIRONMENT: development
      DEBUG: "true"
      CORS_ORIGINS_STR: "http://localhost:5173,http://127.0.0.1:5173"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      # Vite proxy가 /api 요청을 backend:8000으로 전달 (vite.config.ts 참고)
      VITE_API_URL: ""
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
